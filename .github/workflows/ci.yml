name: ZaaykaTech CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck and Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

      - name: Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://mock-ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-mock
          NEXT_PUBLIC_APP_URL: http://localhost:3000

